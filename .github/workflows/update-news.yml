name: Update racing news and races

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update news (RU)
        run: python scripts/update_news.py
        continue-on-error: true

      - name: Update today's races
        env:
          FORMFAV_API_KEY: ${{ secrets.FORMFAV_API_KEY }}
        run: python scripts/update_races.py
        continue-on-error: true

      - name: Update results / winners
        env:
          FORMFAV_API_KEY: ${{ secrets.FORMFAV_API_KEY }}
        run: python scripts/update_results.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/races.json data/results.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update news, races and results"
            git push
          fi
